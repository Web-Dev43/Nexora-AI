<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b10"><title>NEXORA Operator</title>
<style>
:root{color-scheme:dark;--bg:#070b10;--panel:#0d1721;--line:#1c3947;--cyan:#36e4f5;--muted:#8ba2af;--text:#e8f5f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#10313c 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:800;letter-spacing:.12em}.brand b{color:var(--cyan)}main{max-width:1100px;margin:32px auto;padding:0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.login{max-width:420px;margin:10vh auto}.muted{color:var(--muted)}input,textarea{width:100%;background:#09131c;border:1px solid #294653;color:var(--text);border-radius:10px;padding:12px;font:inherit;margin:7px 0 14px}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:10px;padding:11px 16px;background:var(--cyan);color:#031116;font-weight:800;cursor:pointer}button.secondary{background:#1b303a;color:var(--text);border:1px solid #31515d}button:disabled{opacity:.5}#layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}.conversation{width:100%;text-align:left;background:#101f29;color:var(--text);border:1px solid #223e4b;padding:12px}.conversation.active{border-color:var(--cyan)}#messages{height:55vh;min-height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 0}.msg{max-width:85%;padding:10px 13px;border-radius:12px;background:#142630;white-space:pre-wrap;overflow-wrap:anywhere}.msg.visitor{align-self:flex-start}.msg.operator{align-self:flex-end;background:#0e3a45;border:1px solid #1b7785}.error{color:#ff9b9b;min-height:20px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.hidden{display:none}@media(max-width:700px){#layout{grid-template-columns:1fr}.login{margin:5vh auto}#messages{height:40vh}}
</style></head><body>
<header><div class="brand">NEXORA <b>OPERATOR</b></div><button class="secondary hidden" id="logout">Sign out</button></header>
<main>
<section class="panel login" id="login"><h1>Operator access</h1><p class="muted">Sign in with your authorized operator account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p class="error" id="loginError"></p></section>
<section id="dashboard" class="hidden"><div class="row"><div><h1>Conversations</h1><p class="muted">Incoming messages appear here in real time.</p></div><span class="muted" id="operatorState">Connected</span></div>
<div id="layout"><aside class="panel"><h3>Inbox</h3><div id="conversationList" class="list"><p class="muted">Loading conversations…</p></div></aside>
<section class="panel"><div class="row"><h3 id="activeTitle">Select a conversation</h3><button class="secondary" id="reveal" disabled>Reveal prank</button></div><div id="messages"></div><form id="replyForm"><textarea id="reply" maxlength="1000" placeholder="Write a reply…" disabled></textarea><div class="row"><span class="muted">Replies are sent manually by you.</span><button id="replyButton" disabled>Send reply</button></div></form></section></div><p class="error" id="dashboardError"></p></section>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://ejksnhcqbflpdnoaeslw.supabase.co','sb_publishable_NPdTc8IEceJPMI0yHrsJqw_tdnSiKCj');
const $=s=>document.querySelector(s);let currentId=null,channel=null,conversations=[],seen=new Set();
function showError(s){$('#dashboardError').textContent=s||'';}
function addMessage(m){if(seen.has(m.id))return;seen.add(m.id);const el=document.createElement('div');el.className='msg '+(m.sender==='operator'?'operator':'visitor');el.textContent=(m.sender==='operator'?'YOU: ':'VISITOR: ')+m.content;$('#messages').append(el);$('#messages').scrollTop=$('#messages').scrollHeight;}
function renderList(){const list=$('#conversationList');list.replaceChildren();if(!conversations.length){list.textContent='No conversations yet.';return;}for(const c of conversations){const b=document.createElement('button');b.className='conversation'+(c.id===currentId?' active':'');b.textContent='Session '+c.id.slice(0,8)+' · '+new Date(c.last_message_at).toLocaleString();b.onclick=()=>openConversation(c.id);list.append(b);}}
async function loadConversations(){const {data,error}=await supabase.from('nexora_conversations').select('id,created_at,last_message_at').order('last_message_at',{ascending:false});if(error){showError('Could not load inbox. Check that this account is listed in nexora_operators.');return;}conversations=data||[];renderList();}
async function openConversation(id){currentId=id;seen.clear();$('#messages').replaceChildren();$('#activeTitle').textContent='Session '+id.slice(0,8);$('#reply').disabled=false;$('#replyButton').disabled=false;$('#reveal').disabled=false;renderList();if(channel)await supabase.removeChannel(channel);const {data,error}=await supabase.from('nexora_messages').select('id,sender,content,created_at').eq('conversation_id',id).order('created_at');if(error){showError('Unable to read this conversation.');return;}data.forEach(addMessage);channel=supabase.channel('nexora-operator-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'nexora_messages',filter:'conversation_id=eq.'+id},payload=>{addMessage(payload.new);loadConversations();}).subscribe();}
async function boot(){const {data:{user}}=await supabase.auth.getUser();if(!user)return;const {data:operator,error}=await supabase.from('nexora_operators').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!operator){await supabase.auth.signOut();$('#loginError').textContent='This account is not authorized as a NEXORA operator.';return;}$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logout').classList.remove('hidden');await loadConversations();supabase.channel('nexora-inbox').on('postgres_changes',{event:'INSERT',schema:'public',table:'nexora_conversations'},loadConversations).subscribe();}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';const {error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent='Sign-in failed. Check your credentials.';return;}await boot();});
$('#logout').onclick=async()=>{if(channel)await supabase.removeChannel(channel);await supabase.auth.signOut();location.reload();};
$('#replyForm').addEventListener('submit',async e=>{e.preventDefault();const content=$('#reply').value.trim();if(!content||!currentId)return;$('#replyButton').disabled=true;const {error}=await supabase.from('nexora_messages').insert({conversation_id:currentId,sender:'operator',content});if(error)showError('Reply failed. Please try again.');else{$('#reply').value='';showError('');}$('#replyButton').disabled=false;});
$('#reveal').onclick=()=>{const message='Quick reveal: NEXORA is a prank demo. A real person has been replying manually. Thanks for playing along!';$('#reply').value=message;$('#reply').focus();};
boot().catch(e=>{console.error(e);showError('Dashboard could not load.');});
window.addEventListener('beforeunload',()=>{if(channel)supabase.removeChannel(channel);});
</script></body></html>
